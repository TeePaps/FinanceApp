# ============================================================================
# Finance App Configuration
# ============================================================================
# All configurable values in one place. Edit this file to tune the app.
# The config.py module loads these values and exposes them as Python constants.

# ============================================================================
# Cache Settings
# ============================================================================
cache:
  # The enforced price TTL lives in providers.price_cache_seconds (see the
  # `providers:` section) - that is the value DataOrchestrator actually applies.
  # config.PRICE_CACHE_DURATION now derives from it so the UI reports the real
  # number. Uncomment below only to override both with a legacy fixed value.
  # price_cache_duration: 300    # Seconds - how long to cache stock prices
  stale_data_hours: 24           # Hours before valuation data is considered stale

# ============================================================================
# Ticker Health / Exclusion
# ============================================================================
ticker_health:
  failure_threshold: 3           # Consecutive failures before excluding a ticker

# ============================================================================
# Valuation Settings
# ============================================================================
valuation:
  pe_ratio_multiplier: 10        # Fair value = (Avg EPS + Annual Dividend) * this
  min_eps_years: 3               # Minimum years of EPS data required
  recommended_eps_years: 8       # Recommended years for reliable valuation

# ============================================================================
# Split Warning Settings
# ============================================================================
# A stock split makes historical SEC EPS values incomparable to the
# post-split share price, distorting the fair-value calculation. We warn
# the user when a split falls within the EPS averaging window.
split_warning:
  lookback_years: 8              # Flag splits within last N years (should match recommended_eps_years)
  recent_years: 3                # Splits within last N years are "recent" severity
  min_ratio: 1.1                 # Only flag splits with ratio >= this (conservative)

# ============================================================================
# Recommendation Scoring
# ============================================================================
scoring:
  weights:
    undervaluation: 1.0          # Weight for undervaluation score
    dividend: 1.5                # Weight for dividend score
    selloff: 0.8                 # Weight for selloff/pullback score

  dividend:
    no_dividend_penalty: -30     # Penalty for stocks with no dividend
    points_per_percent: 5        # Points per 1% dividend yield
    max_points: 30               # Maximum dividend score

  selloff_bonuses:
    severe: 15
    moderate: 10                 # Also used for 'high' severity
    recent: 5

  min_eps_years: 5               # Minimum EPS years to qualify for recommendations

# ============================================================================
# Sell Candidate Thresholds
# ============================================================================
sell_thresholds:
  overvalued_percent: 10         # % above fair value to consider selling
  gain_percent: 30               # % gain from cost basis to consider selling

# ============================================================================
# Selloff Detection Thresholds
# ============================================================================
selloff_detection:
  # Severe selloff thresholds (price change %)
  severe:
    one_month: -15
    three_month: -25

  # Moderate selloff thresholds
  moderate:
    one_month: -10
    three_month: -15

  # Recent/mild selloff thresholds
  recent:
    one_month: -5
    three_month: -8

  # Volume-based severity (multiplier of normal volume)
  volume:
    severe: 3.0                  # 3x+ normal volume on down days
    high: 2.0                    # 2x-3x normal volume
    moderate: 1.5                # 1.5x-2x normal volume

# ============================================================================
# Rate Limiting & Delays (seconds)
# ============================================================================
rate_limits:
  # Yahoo Finance
  yahoo:
    batch_size: 100              # Tickers per batch
    batch_delay: 0.5             # Seconds between batches
    single_delay: 0.3            # Seconds between single ticker requests
    chunk_delay: 1.5             # Delay between 50-ticker chunks
    history_batch_delay: 0.5     # Delay for price history batches
    # Per-provider pacing enforced by the orchestrator's rate limiter, which is
    # now the single pacing authority - the screener no longer adds its own
    # fixed per-ticker sleep on top of these. Set to the previous *combined*
    # pace so request rates are unchanged.
    dividend_rate_limit: 0.5     # Seconds between dividend fetches
    split_rate_limit: 0.5        # Seconds between split fetches

  # Financial Modeling Prep (FMP)
  fmp:
    rate_limit: 0.2              # Default delay between requests
    rate_limit_backoff: 5        # Wait time after 429 rate limit error
    batch_interval: 0.2          # Delay between batch requests

  # SEC EDGAR
  sec:
    rate_limit: 0.12             # Minimum seconds between requests (10 req/sec limit)
    request_timeout: 30          # Timeout for SEC requests
    cik_cache_days: 7            # Days to cache CIK lookups
    # Annual EPS only changes when a new 10-K lands, so freshness is keyed to
    # the filing calendar rather than a flat TTL: a cached year is current
    # until (next fiscal year end + filing_lag_days) has passed. These are the
    # fallbacks used when a ticker has no usable fiscal-period data.
    eps_cache_days: 1            # Legacy flat TTL - only used with force_flat_ttl
    eps_filing_lag_days: 75      # Days after fiscal year end a 10-K is expected
    eps_recheck_days: 30         # Re-probe interval when fiscal dates are unknown
    eps_max_age_days: 400        # Hard ceiling - always refresh beyond this
    eps_no_data_recheck_days: 90 # Re-probe interval for tickers SEC has no EPS for

  # Interactive Brokers
  ibkr:
    poll_interval: 0.1           # Market data polling interval
    snapshot_wait: 2             # Wait time for snapshot data

  # Screener
  screener:
    dividend_backoff: 0.3        # Delay between dividend fetches
    ticker_pause: 0.5            # Pause between ticker processing
    price_delay: 0.2             # Delay between price fetches

  # General
  dividend_fetch_delay: 0.3      # Delay for dividend batch processing
  eps_backoff_base: 2            # Base for exponential backoff (2^retry)

# ============================================================================
# Provider Settings
# ============================================================================
providers:
  # Provider priority order (first = highest priority)
  price_providers:
    - fmp
    - ibkr
    - yfinance
    - alpaca
    - defeatbeta
  eps_providers:
    - sec_edgar
    - yfinance
    - defeatbeta
  dividend_providers:
    - yfinance
  split_providers:
    - yfinance
    - fmp
    - alpaca
    - sec_edgar
  disabled_providers:
    - alpaca
    - defeatbeta
    - fmp
  price_cache_seconds: 3600      # 1 hour
  eps_cache_days: 1
  dividend_cache_days: 1
  split_cache_days: 7            # Splits change rarely; cache longer

  # Rate limiting
  default_rate_limit: 0.2        # Seconds between requests

  # Batch settings
  batch_size: 100                # Max tickers per batch request
  prefer_batch: true             # Prefer batch-capable providers

  # Timeout settings
  provider_timeout_seconds: 10   # Max time per provider call

  # Circuit breaker
  circuit_breaker:
    enabled: true
    failure_threshold: 3         # Failures before opening circuit
    failure_window_seconds: 300  # Window to count failures (5 min)
    cooldown_seconds: 120        # Wait before retry (2 min)

# ============================================================================
# Index Provider Settings
# ============================================================================
index_providers:
  request_timeout: 30            # Timeout for index provider requests

# ============================================================================
# Background Scheduler Settings
# ============================================================================
scheduler:
  enabled: true                  # Enable automatic price refresh
  price_refresh_interval_minutes: 15  # Minutes between auto-refresh
  market_hours:
    start: "09:30"               # Market open (Eastern Time)
    end: "16:00"                 # Market close (Eastern Time)
    timezone: "America/New_York"

# ============================================================================
# Staleness Dashboard Thresholds
# ============================================================================
staleness:
  price_fresh_minutes: 60        # Green: prices updated within this time
  price_stale_hours: 24          # Red: prices older than this
  dividend_fresh_days: 7         # Green: dividends updated within this time
                                 # Also: skip per-ticker dividend refetch within
  dividend_stale_days: 30        # Red: dividends older than this
  # Refresh policy (how often data is actually re-fetched), matched to how
  # often each kind of data can change. See also rate_limits.sec.eps_* for the
  # filing-calendar-aware EPS policy and providers.split_cache_days for splits.
  dividend_full_sweep_days: 30   # Force an unconditional full dividend sweep
  fifty_two_week_refresh_days: 7 # Refresh existing 52-week high/low after
  fifty_two_week_retry_days: 1   # Back off failed 52-week lookups for
  company_name_retry_days: 7     # Back off failed company-name lookups for
  balance_sheet_refresh_days: 30      # Star input: quarterly filing data
  shares_outstanding_refresh_days: 30 # Star input: quarterly filing data
  analyst_estimate_refresh_days: 7    # Star input: consensus estimates
